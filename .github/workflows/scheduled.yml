name: Scheduled

on:
  schedule:
    - cron: "24 8 * * 0,3,5"

jobs:
  check:
    strategy:
      matrix:
        version: [v2.x, canary]
    name: Check format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.version }}
      - run: deno task check

  test:
    strategy:
      matrix:
        version: [v2.x, canary]
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: pwd
          POSTGRES_DB: nessie
        options: >-
          --health-cmd "pg_isready -U root -d nessie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5100:5432
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_DATABASE: nessie
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5101:3306
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.version }}
      - run: deno task test
      - run: deno task coverage:lcov
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  cli:
    strategy:
      matrix:
        version: [v2.x, canary]
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.version }}
      - name: Run the CLI from the checkout
        shell: bash
        run: |
          set -euo pipefail
          nessie() { deno run -A --config "$GITHUB_WORKSPACE/deno.json" "$GITHUB_WORKSPACE/cli.ts" "$@"; }
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"

          nessie init --dialect sqlite
          # Use the checkout instead of the published package
          perl -pi -e 's#jsr:\@halvardm/nessie\@[^/"]+/clients/([a-z]+)#file://$ENV{GITHUB_WORKSPACE}/clients/$1.ts#; s#jsr:\@halvardm/nessie\@[^"]+#file://$ENV{GITHUB_WORKSPACE}/mod.ts#' nessie.config.ts
          nessie make --name test
          nessie make:migration --name test2
          nessie make:seed --name test

          echo "test" > test_template
          nessie make:migration --migration-template test_template --name test_migration_template
          nessie make:seed --seed-template test_template --name test_seed_template
          for file in db/migrations/*test_migration_template.ts db/seeds/test_seed_template.ts; do
            [[ "$(cat "$file")" == "test" ]] || { echo "$file was not created from the template"; exit 1; }
          done

          rm -rf db nessie.config.ts
          for dialect in postgres mysql sqlite; do
            nessie init --mode config --dialect $dialect
            rm nessie.config.ts
          done
          nessie init --mode folders
